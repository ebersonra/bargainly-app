<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Barganha App</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body>
  <!-- Floating Supermarket Items -->
  <div class="floating-items">
    <div class="floating-item">🛒</div>
    <div class="floating-item">🥬</div>
    <div class="floating-item">🍞</div>
    <div class="floating-item">🥛</div>
    <div class="floating-item">🍎</div>
    <div class="floating-item">🧴</div>
  </div>
  
  <div class="container">
    <div class="logo">
      <div class="logo-text">Barganhα</div>
      <div class="logo-tagline">Smart Shopping • Better Deals</div>
    </div>
    <div class="header">
      <h1>Bem-vindo de volta!</h1>
      <p>Faça login para continuar economizando</p>
    </div>
    <form id="loginForm" class="login-form">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="input-group">
        <label for="password">Senha</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn">Entrar</button>
      <div id="loadingMessage" class="loading" style="display:none;"></div>
      <div id="errorMessage" class="error-message"></div>
    </form>
    
    <!-- Shopping Lists Feature -->
    <div class="feature-highlight">
      <div class="feature-icon">🛒</div>
      <h3>Novo: Sistema de Listas de Compras</h3>
      <p>Organize suas compras, compare preços e compartilhe listas com facilidade!</p>
      <a href="shopping-welcome.html" class="feature-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 4V2C7 1.45 7.45 1 8 1H16C16.55 1 17 1.45 17 2V4H20C20.55 4 21 4.45 21 5S20.55 6 20 6H19V19C19 20.1 18.1 21 17 21H7C5.9 21 5 20.1 5 19V6H4C3.45 6 3 5.55 3 5S3.45 4 4 4H7Z"/>
        </svg>
        Experimentar Agora
      </a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Initialize Supabase client
    let supabaseClient = null;
    
    fetch('/.netlify/functions/get-env')
      .then(res => res.json())
      .then(env => {
        if (env.SUPABASE_URL && env.SUPABASE_PUBLISHABLE_KEY) {
          supabaseClient = supabase.createClient(env.SUPABASE_URL, env.SUPABASE_PUBLISHABLE_KEY);
          window.supabase = supabaseClient;
          
          console.log('Supabase client initialized successfully');
          
          // Check if user is already logged in
          checkExistingSession();
        } else {
          console.error('Missing Supabase credentials');
        }
      })
      .catch(error => {
        console.error('Failed to load environment variables:', error);
      });
      
    async function checkExistingSession() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        
        if (session && session.user) {
          console.log('User already logged in, redirecting...');
          window.location.href = '/';
        }
      } catch (error) {
        console.error('Error checking session:', error);
      }
    }
  </script>
  <script src="/src/utils/auth.js"></script>
  <script src="/src/utils/ui.js"></script>
  <script src="/src/controllers/frontend/loginController.js"></script>
</body>
</html>
